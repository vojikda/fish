<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kvíz o rybách</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <h1>Kvíz o rybách</h1>
        <div id="playerTag" class="playerTag">Hráč: -</div>
        <div class="stats">
          <div>
            <div class="label">Skóre</div>
            <div id="score" class="value">0</div>
          </div>
          <div>
            <div class="label">Kolo</div>
            <div id="round" class="value">1 / 15</div>
          </div>
          <div>
            <div class="label">Série</div>
            <div id="streak" class="value">0</div>
          </div>
          <div>
            <div class="label">Čas</div>
            <div id="timer" class="value">20 s</div>
          </div>
        </div>
      </header>

      <section id="quiz" class="quiz" aria-live="polite">
        <div class="progressWrap" aria-hidden="true">
          <div id="progressBar" class="progressBar"></div>
        </div>
        <div class="prompt">
          <div class="imageWrap">
            <img id="fishImage" alt="Ryba" class="birdImage" />
          </div>
        </div>

        <div class="options" role="group" aria-label="Možnosti odpovědi">
          <button class="option" type="button" data-option-index="0"></button>
          <button class="option" type="button" data-option-index="1"></button>
          <button class="option" type="button" data-option-index="2"></button>
          <button class="option" type="button" data-option-index="3"></button>
        </div>

        <div class="feedback" aria-live="polite">
          <div id="feedbackText" class="feedbackText"></div>
          <div id="correctReveal" class="correctReveal" hidden></div>
        </div>

        <div class="controls">
          <button id="nextBtn" class="nextBtn" type="button" disabled>Další</button>
          <button id="restartBtn" class="nextBtn secondary" type="button" hidden>Hrát znovu</button>
        </div>

        <section class="birdInfo" aria-live="polite">
          <div class="birdInfoTitle">Zajímavost o rybě</div>
          <div id="fishInfoBox" class="birdInfoBox" hidden></div>
        </section>
      </section>

      <section class="leaderboard" aria-live="polite">
        <div class="leaderboardHeader">
          <h2>Tabulka rekordů</h2>
          <button id="clearScoresBtn" class="nextBtn secondary" type="button">Smazat rekordy</button>
        </div>
        <div id="personalBest" class="personalBest">Tvůj nejlepší výsledek: -</div>
        <ol id="leaderboardList" class="leaderboardList"></ol>
      </section>

      <section id="loading" class="loading" aria-live="polite">
        <div class="loadingCard">
          <div class="spinner" aria-hidden="true"></div>
          <div class="loadingText">Načítám ryby...</div>
        </div>
      </section>
    </main>

    <div id="playerModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="playerModalTitle" hidden>
      <div class="modalCard">
        <h2 id="playerModalTitle">Vítej v kvízu</h2>
        <p>Zadej jméno hráče, pod kterým se uloží výsledek.</p>
        <input
          id="playerNameInput"
          class="playerInput"
          type="text"
          maxlength="20"
          placeholder="Např. Daniel"
          autocomplete="nickname"
        />
        <div class="modalControls">
          <button id="startQuizBtn" class="nextBtn" type="button">Začít hru</button>
        </div>
      </div>
    </div>

    <script defer src="./app.js"></script>
  </body>
</html>
